<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        div>h1 {
            background-color: red;

        }

        div+p {
            background-color: brown;

        }

        div~p {
            background-color: blueviolet;

        }
    </style>
</head>

<body>
    <div>
        <p>First paragraph</p>
        <p>Second paragraph</p>
        <h1>hi</h1>
    </div>

    <p>Third paragraph</p>
    <p>Fourth paragraph</p>
    <p>Fifth paragraph</p>
</body>


</html>
