<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick = "show()"> Click </button>

    <button onclick = "config()"> Confirm </button>
    <p id = p1>........</p>


    <button onclick = "prom()">prompt</button>
    <p id = p2>.......</p>
    <script>

        function show(){
            alert ("Welcome")
        }

        function config(){
            let value =  confirm("Are you sure you want to delete this")

            if(value == true){
                document.getElementById("p1").innerHTML = "Delete"
            }else{
                document.getElementById("p1").innerHTML = "Not Delete"
            }
        }

        function prom(){

            let a = prompt("enter your name")
            if(a != null){
                document.getElementById("p2").innerHTML = "Name"
            }else{
                document.getElementById("p2").innerHTML = "Empty"
            }

        }

       

    </script>
</body>
</html>
